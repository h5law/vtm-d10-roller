<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VtM d10 Roller</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <main class="container">
    <section class="dice-section">
      <button id="add-die" class="dice-button" title="Add one die">
        <img src="dice.png" alt="Add die">
      </button>
      <div class="add-die-label">+1 Die</div>
    </section>

    <section class="middle-section">
      <div class="setting">
        <div class="setting-label">Pool</div>
        <div id="pool-count" class="pool-count">0</div>
        <div id="pool-text" class="pool-text">dice</div>
      </div>

      <div class="setting">
        <label class="setting-label" for="threshold">Success Threshold</label>
        <input id="threshold" type="number" min="1" max="10" value="6">
      </div>

      <div class="setting">
        <label class="setting-label" for="difficulty">Difficulty</label>
        <input id="difficulty" type="number" min="0" value="1">
      </div>
    </section>

    <section class="stats-section">
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Critical Wins</div>
          <div id="criticals" class="stat-number">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Messy Criticals</div>
          <div id="messy-criticals" class="stat-number">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Successes</div>
          <div id="successes" class="stat-number">0</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-label">Bestial Failures</div>
          <div id="bestial" class="stat-number">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Messy Failures</div>
          <div id="messy-failures" class="stat-number">0</div>
        </div>

        <div class="stat-box">
          <div class="stat-label">Failures</div>
          <div id="failures" class="stat-number">0</div>
        </div>
      </div>

      <div class="result-box">
        <div class="box-title">Current Roll</div>
        <div id="results" class="results">[]</div>
        <div id="outcome" class="outcome">No roll yet</div>
      </div>
    </section>

    <section class="actions-section">
      <button id="roll" class="roll-button" disabled>ROLL</button>
      <button id="reset" class="reset-button">RESET</button>
    </section>
  </main>

  <script src="popup.js"></script>

</body>
</html>
